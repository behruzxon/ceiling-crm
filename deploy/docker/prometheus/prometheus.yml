# Prometheus scrape configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'ceiling_crm_bot'
    static_configs:
      # Production runs the bot in webhook mode, which serves /metrics (and
      # /health) on port 8080 (apps/bot/main.py run_webhook -> port 8080).
      # The 9090 health/metrics server only runs in dev polling mode.
      - targets: ['bot:8080']
    metrics_path: '/metrics'
